<!doctype html>
<html lang="en" data-template="hook">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: var(--canvas-width, 540px); height: var(--canvas-height, 675px); overflow: hidden; }
body { background: var(--brand-background, #f7f5ef); color: var(--brand-ink, #242321); font-family: var(--brand-body-family, sans-serif); font-weight: var(--brand-body-weight, 400); }
main { position: absolute; inset: var(--safe-top, 0px) var(--safe-right, 0px) var(--safe-bottom, 0px) var(--safe-left, 0px); padding: calc(var(--canvas-width, 540px) * .03); display: flex; flex-direction: column; justify-content: center; gap: calc(var(--canvas-width, 540px) * .022); }
p, h1 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: var(--min-text-size, 16px); font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--brand-accent, #57534e); }
h1 { font-family: var(--brand-display-family, serif); font-weight: var(--brand-display-weight, 400); font-size: calc(var(--canvas-width, 540px) * .085); line-height: 1.08; }
.subline { font-size: calc(var(--min-text-size, 16px) * 1.1); font-weight: 500; line-height: 1.35; }
.logo { max-width: 25%; max-height: calc(var(--min-text-size, 16px) * 1.8); object-fit: contain; object-position: left; align-self: flex-start; }
.art { min-height: 0; flex: 0 1 auto; height: calc(var(--canvas-height, 675px) * .3); max-width: 100%; object-fit: contain; }
[data-slot]:not(img):empty { display: none; }
@media (max-aspect-ratio: 9/16) {
  main:has(.art) { justify-content: flex-start; padding-bottom: 0; }
  main:has(.art) > :not(.art) { flex-shrink: 0; }
  .art { flex: 1; height: 0; width: 100%; max-height: none; object-fit: cover; object-position: center; }
}
@media (min-aspect-ratio: 3/2) {
  main { display: grid; grid-template-columns: 1fr auto; grid-auto-rows: min-content; align-content: center; column-gap: calc(var(--canvas-width, 540px) * .04); }
  main > :not(.art) { grid-column: 1; }
  h1 { font-size: calc(var(--canvas-width, 540px) * .06); }
  .art { grid-column: 2; grid-row: 1 / span 4; align-self: center; height: calc(var(--canvas-height, 675px) * .6); width: auto; }
}
</style>
</head>
<body>
<main>
<img class="logo" data-slot="logo" alt="">
<p class="eyebrow" data-slot="eyebrow"></p>
<h1 data-slot="headline"></h1>
<p class="subline" data-slot="subline"></p>
<img class="art" data-slot="image" alt="">
</main>
</body>
</html>
