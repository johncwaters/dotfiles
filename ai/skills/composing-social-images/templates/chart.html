<!doctype html>
<html lang="en" data-template="chart">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: var(--canvas-width, 540px); height: var(--canvas-height, 675px); overflow: hidden; }
body { background: var(--brand-background, #f7f5ef); color: var(--brand-ink, #242321); font-family: var(--brand-body-family, sans-serif); font-weight: var(--brand-body-weight, 400); }
main { position: absolute; inset: var(--safe-top, 0px) var(--safe-right, 0px) var(--safe-bottom, 0px) var(--safe-left, 0px); padding: calc(var(--canvas-width, 540px) * .04); display: flex; flex-direction: column; justify-content: center; gap: calc(var(--canvas-width, 540px) * .022); }
p, h1, ul { margin: 0; text-wrap: balance; }
.logo { max-width: 25%; max-height: calc(var(--min-text-size, 16px) * 1.8); object-fit: contain; object-position: left; align-self: flex-start; }
h1 { font-family: var(--brand-display-family, sans-serif); font-weight: var(--brand-display-weight, 400); font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .068)); line-height: 1.1; }
.subline, .legend, .chart-value, .chart-label, .note { font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .026)); line-height: 1.3; }
.subline, .note { color: color-mix(in srgb, var(--brand-ink, #242321) 68%, transparent); }
.legend { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4em 1.6em; }
.legend li { display: flex; align-items: center; gap: .5em; }
.legend li::before { content: ""; width: .8em; height: .8em; border-radius: .2em; background: var(--series-color); }
.legend li:nth-child(1), .chart-row[data-series="1"] { --series-color: var(--brand-accent, #c2410c); }
.legend li:nth-child(2), .chart-row[data-series="2"] { --series-color: color-mix(in srgb, var(--brand-ink, #242321) 80%, var(--brand-background, #f7f5ef)); }
.legend li:nth-child(3), .chart-row[data-series="3"] { --series-color: color-mix(in srgb, var(--brand-ink, #242321) 38%, var(--brand-background, #f7f5ef)); }
.chart { display: grid; grid-template-columns: minmax(min-content, 28%) 1fr; gap: calc(var(--canvas-width, 540px) * .02); }
.chart-group { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; gap: calc(var(--canvas-width, 540px) * .02); align-items: center; padding-top: calc(var(--canvas-width, 540px) * .016); border-top: 1px solid color-mix(in srgb, var(--brand-ink, #242321) 18%, transparent); }
.chart-label { font-weight: 700; }
.chart-bars { display: flex; flex-direction: column; gap: calc(var(--canvas-width, 540px) * .008); }
.chart-row { display: flex; align-items: center; gap: .5em; }
.chart-bar { flex-shrink: 0; height: 1.1em; min-width: 2px; width: calc(var(--bar-fraction, 0) * (100% - 6em)); border-radius: 0 .25em .25em 0; background: var(--series-color); }
.chart-value { white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.05; }
.chart-row[data-series="1"] .chart-value { font-weight: 700; }
[data-slot]:not(img):empty, [data-slot-list]:empty { display: none; }
@media (min-aspect-ratio: 3/2) {
  main { gap: calc(var(--canvas-height, 675px) * .022); padding: calc(var(--canvas-height, 675px) * .02) calc(var(--canvas-width, 540px) * .03); }
  h1 { font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .042)); }
  .subline, .legend, .chart-value, .chart-label, .note { font-size: var(--min-text-size, 16px); }
  .chart { gap: calc(var(--canvas-height, 675px) * .015); }
  .chart-group { padding-top: calc(var(--canvas-height, 675px) * .015); }
  .chart-bars { gap: calc(var(--canvas-height, 675px) * .006); }
  .chart-bar { height: .9em; }
}
</style>
</head>
<body>
<main>
<img class="logo" data-slot="logo" alt="">
<h1 data-slot="headline"></h1>
<p class="subline" data-slot="subline"></p>
<ul class="legend" data-slot-list="series"></ul>
<div class="chart" data-slot-chart></div>
<p class="note" data-slot="note"></p>
</main>
</body>
</html>
