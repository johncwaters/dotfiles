<!doctype html>
<html lang="en" data-template="carousel">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: var(--canvas-width, 540px); height: var(--canvas-height, 675px); overflow: hidden; }
body { background: var(--brand-background, #f7f5ef); color: var(--brand-ink, #242321); font-family: var(--brand-body-family, sans-serif); font-weight: var(--brand-body-weight, 400); }
main { position: absolute; inset: var(--safe-top, 0px) var(--safe-right, 0px) var(--safe-bottom, 0px) var(--safe-left, 0px); padding: calc(var(--canvas-width, 540px) * .025); display: flex; flex-direction: column; gap: calc(var(--canvas-width, 540px) * .025); }
p, h1, h2, li { margin: 0; text-wrap: balance; }
header { display: flex; align-items: center; gap: calc(var(--canvas-width, 540px) * .02); }
.logo { width: calc(var(--min-text-size, 16px) * 1.8); height: calc(var(--min-text-size, 16px) * 1.8); object-fit: contain; }
.eyebrow { font-size: var(--min-text-size, 16px); letter-spacing: .1em; text-transform: uppercase; color: var(--brand-accent, #57534e); }
h1 { font-family: var(--brand-display-family, sans-serif); font-weight: var(--brand-display-weight, 400); font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .072)); line-height: 1.12; }
.subline, li, .context, .label, .date { font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .033)); line-height: 1.4; }
ul { padding: 0; margin: 0; list-style: none; display: grid; gap: calc(var(--canvas-width, 540px) * .018); }
li { padding: calc(var(--canvas-width, 540px) * .016); background: var(--brand-surface, #ffffff); border: 1px solid color-mix(in srgb, var(--brand-ink, #242321) 22%, transparent); }
pre { margin: 0; padding: calc(var(--canvas-width, 540px) * .024); font-family: var(--brand-mono-family, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); font-weight: var(--brand-mono-weight, 400); font-size: calc(var(--min-text-size, 16px) * 1.25); line-height: 1.5; white-space: pre; overflow-wrap: normal; word-break: normal; hyphens: none; background: var(--brand-surface, #ffffff); border: 1px solid color-mix(in srgb, var(--brand-accent, #57534e) 40%, transparent); }
[data-slot]:not(img):empty, [data-slot-list]:empty, [data-slot-code]:empty { display: none; }
[hidden] { display: none !important; }
@media (min-aspect-ratio: 3/2) { h1 { font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .052)); } }
main { border: 1px solid color-mix(in srgb, var(--brand-accent, #57534e) 35%, transparent); }
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--canvas-width, 540px) * .028); }
.art { display: block; width: 100%; max-height: calc(var(--canvas-height, 675px) * .38); min-height: 0; object-fit: contain; }
footer { display: flex; align-items: center; justify-content: space-between; min-height: var(--min-text-size, 16px); font-size: var(--min-text-size, 16px); color: var(--brand-accent, #57534e); }
.progress { display: flex; gap: calc(var(--min-text-size, 16px) * .45); }
.progress span { width: calc(var(--min-text-size, 16px) * .45); height: calc(var(--min-text-size, 16px) * .45); border: 1px solid var(--brand-accent, #57534e); border-radius: 50%; }
.progress [data-active="true"] { background: var(--brand-accent, #57534e); }

</style>
</head>
<body>
<main><header><img class="logo" data-slot="logo" alt=""><p class="eyebrow" data-slot="eyebrow"></p></header><section class="content"><h1 data-slot="headline"></h1><p class="subline" data-slot="subline"></p><ul data-slot-list="items"></ul><img class="art" data-slot="image" alt=""><pre data-slot-code></pre></section><footer><div class="progress" data-carousel-progress></div><span data-swipe-cue>Swipe to explore</span></footer></main>
</body>
</html>
