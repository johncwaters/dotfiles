<!doctype html>
<html lang="en" data-template="release">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: var(--canvas-width, 540px); height: var(--canvas-height, 675px); overflow: hidden; }
body { background: var(--brand-background, #f7f5ef); color: var(--brand-ink, #242321); font-family: var(--brand-body-family, sans-serif); font-weight: var(--brand-body-weight, 400); }
main { position: absolute; inset: var(--safe-top, 0px) var(--safe-right, 0px) var(--safe-bottom, 0px) var(--safe-left, 0px); padding: calc(var(--canvas-width, 540px) * .025); display: flex; flex-direction: column; gap: calc(var(--canvas-width, 540px) * .025); }
p, h1, h2, li { margin: 0; text-wrap: balance; }
header { display: flex; align-items: center; gap: calc(var(--canvas-width, 540px) * .02); }
.logo { width: calc(var(--min-text-size, 16px) * 1.8); height: calc(var(--min-text-size, 16px) * 1.8); object-fit: contain; }
.eyebrow { font-size: var(--min-text-size, 16px); letter-spacing: .1em; text-transform: uppercase; color: var(--brand-accent, #57534e); }
h1 { font-family: var(--brand-display-family, sans-serif); font-weight: var(--brand-display-weight, 400); font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .072)); line-height: 1.12; }
.subline, li, .context, .label, .date { font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .033)); line-height: 1.4; }
ul { padding: 0; margin: 0; list-style: none; display: grid; gap: calc(var(--canvas-width, 540px) * .018); }
li { padding: calc(var(--canvas-width, 540px) * .016); background: var(--brand-surface, #ffffff); border: 1px solid color-mix(in srgb, var(--brand-ink, #242321) 22%, transparent); }
[data-slot]:not(img):empty, [data-slot-list]:empty, [data-slot-code]:empty { display: none; }
[hidden] { display: none !important; }
@media (min-aspect-ratio: 3/2) { h1 { font-size: max(var(--min-text-size, 16px), calc(var(--canvas-width, 540px) * .052)); } }
@media (min-aspect-ratio: 3/2) { ul { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
main { justify-content: center; }
.release-lockup { display: flex; flex-wrap: wrap; align-items: baseline; gap: calc(var(--canvas-width, 540px) * .025); }
li strong, li span { display: block; font-size: var(--min-text-size, 16px); }
li strong { color: var(--brand-accent, #57534e); }
li span { margin-top: calc(var(--min-text-size, 16px) * .4); font-size: var(--min-text-size, 16px); }
</style>
</head>
<body>
<main><header><img class="logo" data-slot="logo" alt=""><p class="eyebrow" data-slot="eyebrow"></p></header><div class="release-lockup"><h1 data-slot="version"></h1><p class="date" data-slot="date"></p></div><ul data-slot-list="highlights"></ul><p class="subline" data-slot="subline"></p></main>
</body>
</html>
