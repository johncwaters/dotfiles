<html>
<head>
<style>
body{font-family:Calibri,sans-serif;font-size:11pt;}
p{font-family:Calibri,sans-serif;font-size:11pt;margin-top:0pt;margin-bottom:8pt;line-height:108%;}
li{font-family:Calibri,sans-serif;font-size:11pt;margin-top:0pt;margin-bottom:0pt;line-height:108%;}
h1{font-family:Calibri,sans-serif;font-size:16pt;font-weight:bold;margin-top:18pt;margin-bottom:6pt;}

table{border-collapse:collapse;}
td{border:1px solid #000000;padding:4pt 5pt 4pt 5pt;vertical-align:top;}
td p{margin-bottom:0pt;line-height:100%;}
.h{background-color:#f2f2f2;}
.c{font-family:Consolas,monospace;font-size:10pt;background-color:#f5f5f5;}

</style>
</head>
<body>
<h1>Doc title</h1>
<p>TLDR in plain text, answer first.</p>
<h2>Section</h2>
<p>Paragraph with a <span class="c">code_span</span> inline.</p>
<ul>
<li>Bullet</li>
<li class="last">Last bullet carries the paragraph gap</li>
</ul>
<h3>Subsection</h3>
<ol>
<li>Step</li>
<li class="last">Last step</li>
</ol>
<table>
<tr><td class="h" style="width:140pt"><p>Header</p></td><td class="h" style="width:328pt"><p>Header widths sum to 468pt</p></td></tr>
